<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Shield outline -->
  <defs>
    <clipPath id="shieldClip">
      <path d="M100 8 L184 30 L184 130 C184 185 150 218 100 232 C50 218 16 185 16 130 L16 30 Z"/>
    </clipPath>
  </defs>

  <path d="M100 6 L187 29 L187 130 C187 188 152 222 100 236 C48 222 13 188 13 130 L13 29 Z"
        fill="#3E1A5B" />
  <path d="M100 12 L181 33 L181 130 C181 182 148 214 100 227 C52 214 19 182 19 130 L19 33 Z"
        fill="#EDE3F5" />

  <g clip-path="url(#shieldClip)">
    <!-- Uganda flag stripe on the left -->
    <rect x="13" y="12" width="26" height="220" fill="#111111"/>
    <rect x="39" y="12" width="26" height="220" fill="#C8102E"/>

    <!-- Ground mound -->
    <ellipse cx="120" cy="205" rx="70" ry="22" fill="#3E1A5B" opacity="0.9"/>

    <!-- Crested crane, simplified -->
    <g transform="translate(95,95)">
      <!-- body -->
      <ellipse cx="20" cy="70" rx="20" ry="34" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
      <!-- wing detail -->
      <path d="M4 55 Q20 65 8 95" fill="none" stroke="#111111" stroke-width="2"/>
      <!-- neck -->
      <path d="M14 42 C6 24 10 6 22 -8" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="24" cy="-12" r="8" fill="#111111"/>
      <!-- crest -->
      <path d="M18 -20 C14 -30 20 -34 22 -26 C24 -34 30 -32 27 -22 C33 -26 36 -20 30 -16 C34 -14 33 -8 27 -10"
            fill="#E8B800"/>
      <!-- beak -->
      <path d="M31 -12 L40 -10 L31 -6 Z" fill="#111111"/>
      <!-- red wattle -->
      <circle cx="26" cy="-6" r="2.5" fill="#C8102E"/>
      <!-- legs -->
      <line x1="16" y1="100" x2="10" y2="128" stroke="#111111" stroke-width="3"/>
      <line x1="26" y1="100" x2="30" y2="128" stroke="#111111" stroke-width="3"/>
    </g>

    <!-- fleur-de-lis emblem -->
    <g transform="translate(100,196) scale(0.9)">
      <path d="M0 -18 C-6 -12 -6 -2 0 4 C6 -2 6 -12 0 -18 Z" fill="#3E1A5B"/>
      <path d="M0 4 C-10 4 -16 -4 -12 -14 C-14 -4 -8 2 0 -1 Z" fill="#3E1A5B"/>
      <path d="M0 4 C10 4 16 -4 12 -14 C14 -4 8 2 0 -1 Z" fill="#3E1A5B"/>
      <rect x="-2.5" y="2" width="5" height="12" fill="#3E1A5B"/>
      <rect x="-9" y="10" width="18" height="4" rx="1.5" fill="#3E1A5B"/>
    </g>
  </g>

  <!-- Shield border -->
  <path d="M100 6 L187 29 L187 130 C187 188 152 222 100 236 C48 222 13 188 13 130 L13 29 Z"
        fill="none" stroke="#E8B800" stroke-width="4"/>
</svg>
